# Workflow
# Mention Workflow Name 
name: Hello
# On tells when the workflow should run
on:
  workflow_dispatch: 
# Jobs ell what the workflow should do, there can be one or more than one job
jobs:
  # Mention Job Name 
  say-hello:
    #Creates a Ephermel container with ubuntu running in it, It's role is to run job
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone
        run: echo "hello World"
        
  say-Bye:
    #Creates a Ephermel container with ubuntu running in it, It's role is to run job
    runs-on: ubuntu-latest
    steps:
      - name: Say Bye to everyone
        run: echo "bye World my workflow is comolted"
